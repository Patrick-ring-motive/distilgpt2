<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <log></log>
  <script type="module">
  self.log = (...x) =>{
    document.getElementsByTagName('log')[0].innerHTML += x.join(' ') + '<br>';
  };
  try{
    await import("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs");
    await import("https://patrick-ring-motive.github.io/distilgpt2/bert/qna.js");
    //https://cdn.jsdelivr.net/npm/@tensorflow-models/qna.js
    const stringify = x =>{
      try{
        return JSON.stringify(x);
      }catch{
        return String(x);
      }
    };
    const context = [];
    const passage = 'The capital of France is Paris.';
    const question = 'What happens next?';
    context.push(passage);
    await tf.setBackend('webgl');     
    await tf.ready();
    const model = await qna.load();
    for(const key in model){
      log(key);
    }
    log(context.join(' ').trim().slice(0,-1).split(/[\.\?\!]/).pop());
    const answers = await model.findAnswers(question,context.join(' '));
    context.push(question);
    log(stringify(answers));
    let answer = stringify(answers);
    let bestScore = 0;
    for(const a of answers){
      const score = a.text.length * a.score;
      if(score > bestScore){
        bestScore = score;
        answer = a.text;
      }
    }
    log(stringify(answer));
  }catch(e){
    log(e?.message ?? e);
  }
  </script>
</body>
</html>
